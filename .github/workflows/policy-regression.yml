name: Policy Regression

on:
  push:
    branches: [ "main" ]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run current policy tests
        run: node test/run-policy-tests.js > current.json

      - name: Compare with baseline
        run: |
          diff baseline.json current.json || (echo "Policy regression detected" && exit 1)
