name: policy-regression

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run policy tests
        run: node test/run-policy-tests.js > current.json

      - name: Compare with baseline
        run: diff baseline.json current.json
